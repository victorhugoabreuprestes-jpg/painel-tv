<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel da TV</title>
<style>
  :root { color-scheme: dark; --bg:#10151d; --panel:#1b2430; --line:#303c4b; --text:#f3f6fa; --muted:#aeb9c7; --accent:#72a7ff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:16px/1.4 Arial, sans-serif; cursor:none; }
  main { display:grid; grid-template-columns:65fr 35fr; grid-template-rows:1fr 1fr; gap:10px; padding:10px; height:100vh; }
  .card { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:12px; min-height:0; min-width:0; overflow:hidden; }
  .agenda { grid-row:1 / span 2; }
  .tag { position:absolute; left:10px; top:8px; z-index:2; font-size:13px; color:var(--muted); background:rgba(8,11,16,.7); padding:3px 8px; border-radius:6px; }
  iframe, img { width:100%; height:100%; border:0; object-fit:contain; background:#080b10; display:block; }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--muted); }
  .msg[hidden] { display:none; }
  #clock { position:absolute; right:10px; top:8px; z-index:3; font-size:14px; color:var(--text); background:rgba(8,11,16,.7); padding:3px 8px; border-radius:6px; }
</style>
</head>
<body>
<main>
  <section class="card agenda">
    <span class="tag">Agenda</span>
    <iframe id="agenda" title="Agenda" hidden></iframe>
    <div id="agendaMsg" class="msg">Agenda não configurada.</div>
  </section>

  <section class="card">
    <span class="tag">Câmera</span>
    <img id="cam" alt="Câmera" hidden>
    <div id="camMsg" class="msg">Conectando à câmera…</div>
  </section>

  <section class="card">
    <span class="tag">Relógio ao vivo</span>
    <iframe id="relogioFrame" title="Transmissão do relógio" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  </section>
</main>
<div id="clock">--:--</div>

<script>
  // ===== CONFIGURAÇÕES DO PAINEL =====
  const CALENDAR_URL = "https://outlook.office365.com/owa/calendar/8d52ee2b21334f289618adbd21040619@sistemafiep.org.br/a963dd084c9e48a8b7281a55dc69411410467635187235794292/calendar.html";
  const CAM_URL = "http://192.168.65.121:8080/stream/getvideo";
  const YOUTUBE_VIDEO_ID = "kPAL45DqaAM";
  // ===================================

  // Relógio do canto da tela
  const clock = document.getElementById('clock');
  const tick = () => clock.textContent = new Intl.DateTimeFormat('pt-BR', { dateStyle:'short', timeStyle:'short' }).format(new Date());
  tick(); setInterval(tick, 15000);

  // Agenda corporativa
  if (CALENDAR_URL) {
    const f = document.getElementById('agenda');
    f.src = CALENDAR_URL; f.hidden = false;
    document.getElementById('agendaMsg').hidden = true;
  }

  // Câmera principal (stream MJPEG com reconexão automática)
  const cam = document.getElementById('cam'), camMsg = document.getElementById('camMsg');
  function connectCam() {
    cam.onload = () => { cam.hidden = false; camMsg.hidden = true; };
    cam.onerror = () => {
      cam.hidden = true; camMsg.hidden = false;
      camMsg.textContent = 'Sem sinal da câmera. Tentando de novo…';
      setTimeout(connectCam, 8000);
    };
    cam.src = CAM_URL + '?t=' + Date.now();
  }
  connectCam();

  // Transmissão do YouTube (com origin explícito para evitar bloqueio no GitHub Pages)
  const relFrame = document.getElementById('relogioFrame');
  const originParam = encodeURIComponent(window.location.origin);
  relFrame.src = `https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?autoplay=1&mute=1&playsinline=1&rel=0&origin=${originParam}`;

  // Recarrega a página 1x por dia para limpar memória no Raspberry Pi
  setTimeout(() => location.reload(), 24 * 60 * 60 * 1000);
</script>
</body>
</html>
